<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porto da Praia - Sala de Espera (TV)</title>
  <style>
    body { background: #020617; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
    .container { text-align: center; border: 4px solid #38bdf8; padding: 50px; border-radius: 24px; background: #0f172a; box-shadow: 0 0 50px rgba(56, 189, 248, 0.3); width: 85%; max-width: 950px; }
    h2 { color: #94a3b8; font-size: clamp(1.8rem, 4vw, 2.8rem); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
    #senhaAtual { font-size: clamp(5rem, 15vw, 9rem); font-weight: 900; color: #38bdf8; margin: 20px 0; text-shadow: 0 0 25px rgba(56,189,248,0.5); }
    #balcaoAtual { font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 700; color: #10b981; }
    .footer { margin-top: 35px; color: #64748b; font-size: clamp(1rem, 2vw, 1.3rem); }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="tv-title">SENHA EM ATENDIMENTO</h2>
    <div id="senhaAtual">---</div>
    <div id="balcaoAtual">Balcão: ---</div>
    <div class="footer" id="tv-footer">ENAPOR - Porto Internacional da Praia | Zero Touch</div>
  </div>

  <script>
    let ultimaSenhaRegistada = '';

    const i18nTV = {
      cv: { title: "SENHA NA ATENDIMENTU", footer: "ENAPOR - Portu Internacional di Praia" },
      pt: { title: "SENHA EM ATENDIMENTO", footer: "ENAPOR - Porto Internacional da Praia | Zero Touch" },
      en: { title: "NOW SERVING TICKET", footer: "ENAPOR - Port of Praia International" },
      fr: { title: "TICKET EN COURS DE SERVICE", footer: "ENAPOR - Port International de Praia" },
      es: { title: "TURNO EN ATENCIÓN", footer: "ENAPOR - Puerto Internacional de Praia" },
      ar: { title: "التذكرة قيد الخدمة حاليا", footer: "ميناء برايا الدولي - إينابور", rtl: true },
      zh: { title: "当前服务号码", footer: "ENAPOR - 普拉亚国际港口" }
    };

    async function verificarEstadoTV() {
      try {
        const res = await fetch('/api/estado-tv');
        const data = await res.json();
        
        if (data.ultimaChamada && data.ultimaChamada.senha !== ultimaSenhaRegistada) {
          ultimaSenhaRegistada = data.ultimaChamada.senha;
          const lingua = data.ultimaChamada.lingua || 'pt';
          
          // Aplicar caligrafia e tradução de acordo com a língua escolhida pelo cliente
          aplicarEstiloETextoLingua(lingua, data.ultimaChamada.balcao);
          
          document.getElementById('senhaAtual').innerText = ultimaSenhaRegistada;
          document.getElementById('balcaoAtual').innerText = data.ultimaChamada.balcao;
          
          // Falar em voz alta na língua correta
          falarChamada(ultimaSenhaRegistada, data.ultimaChamada.balcao, lingua);
        }
      } catch (err) { console.error('Erro TV', err); }
    }

    function aplicarEstiloETextoLingua(lingua, balcao) {
      const conf = i18nTV[lingua] || i18nTV['pt'];
      
      document.getElementById('tv-title').innerText = conf.title;
      document.getElementById('tv-footer').innerText = conf.footer;

      // Ajustar caligrafia e alinhamento para Árabe (RTL) ou Chinês (Fontes asiáticas)
      if (conf.rtl) {
        document.body.style.direction = 'rtl';
        document.body.style.fontFamily = "'Amiri', 'Segoe UI', Tahoma, sans-serif";
      } else if (lingua === 'zh') {
        document.body.style.direction = 'ltr';
        document.body.style.fontFamily = "'Microsoft YaHei', sans-serif";
      } else {
        document.body.style.direction = 'ltr';
        document.body.style.fontFamily = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
      }
    }

    function falarChamada(senha, balcao, lingua) {
      if ('speechSynthesis' in window) {
        let texto = `Senha ${senha}, dirija-se ao ${balcao}`;
        let lang = 'pt-PT';

        if (lingua === 'en') { lang = 'en-US'; texto = `Ticket ${senha}, please proceed to ${balcao}`; }
        else if (lingua === 'fr') { lang = 'fr-FR'; texto = `Ticket ${senha}, veuillez vous présenter au ${balcao}`; }
        else if (lingua === 'es') { lang = 'es-ES'; texto = `Ticket ${senha}, por favor diríjase al ${balcao}`; }
        else if (lingua === 'ar') { lang = 'ar-SA'; texto = `التذكرة ${senha}، يرجى التوجه إلى ${balcao}`; }
        else if (lingua === 'zh') { lang = 'zh-CN'; texto = `请凭凭证 ${senha} 前往 ${balcao}`; }
        else if (lingua === 'cv') { lang = 'pt-PT'; texto = `Senha ${senha}, bai pa ${balcao}`; }

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    setInterval(verificarEstadoTV, 3000);
  </script>
</body>
</html>
