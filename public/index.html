<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porto da Praia - Quiosque Zero Touch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #38bdf8; font-size: 2.2rem; }
    header p { color: #94a3b8; font-size: 1.1rem; }
    .lang-selector { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; }
    .lang-btn { background: #1e293b; border: 2px solid #334155; color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: all 0.2s; }
    .lang-btn.active, .lang-btn:hover { background: #0284c7; border-color: #38bdf8; }
    .container { width: 100%; max-width: 900px; background: #1e293b; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .section-title { font-size: 1.3rem; margin-bottom: 15px; color: #e2e8f0; border-bottom: 2px solid #334155; padding-bottom: 8px; }
    .grid-services { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .service-card { background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 1.1rem; font-weight: 600; }
    .service-card:hover, .service-card.selected { border-color: #38bdf8; background: #0369a1; }
    .camera-box { text-align: center; margin-bottom: 25px; }
    video { width: 100%; max-width: 480px; height: 270px; background: #000; border-radius: 12px; border: 2px solid #334155; object-fit: cover; }
    .input-group { margin-bottom: 25px; }
    .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 1rem; }
    .input-group input { width: 100%; padding: 14px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1.1rem; }
    .submit-btn { width: 100%; padding: 18px; background: #10b981; border: none; border-radius: 12px; color: #fff; font-size: 1.4rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .submit-btn:hover { background: #059669; }
  </style>
</head>
<body>
  <header>
    <h1>PORTO DA PRAIA - ENAPOR</h1>
    <p>Atendimento Quiosque Zero Touch</p>
  </header>
  <div class="lang-selector">
    <button class="lang-btn active" onclick="setLang('cv')">Crioulo (CV)</button>
    <button class="lang-btn" onclick="setLang('pt')">Português</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('fr')">Français</button>
    <button class="lang-btn" onclick="setLang('es')">Español</button>
  </div>
  <div class="container">
    <div class="section-title">1. Selecione o Serviço / Seleciona Servisu</div>
    <div class="grid-services">
      <div class="service-card selected" onclick="selectService(this, 'ENC')">📦 Encomendas / Carga</div>
      <div class="service-card" onclick="selectService(this, 'TAX')">💳 Taxas Portuárias</div>
      <div class="service-card" onclick="selectService(this, 'PAS')">🎫 Passes & Credenciais</div>
      <div class="service-card" onclick="selectService(this, 'ALF')">🛃 Despacho Alfandegário</div>
    </div>
    <div class="section-title">2. Aproxime o CNI / Passaporte / QR Code</div>
    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>
    <div class="input-group">
      <label>Número do WhatsApp para Receber a Senha:</label>
      <input type="tel" id="whatsapp" placeholder="Ex: 2389912345">
    </div>
    <button class="submit-btn" onclick="processCheckin()">EMITIR SENHA ZERO TOUCH</button>
  </div>
  <script>
    let currentLang = 'cv';
    let selectedServiceCode = 'ENC';
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
      } catch (err) { console.warn('Câmara indisponível', err); }
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function selectService(el, code) {
      selectedServiceCode = code;
      document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    async function processCheckin() {
      const whatsapp = document.getElementById('whatsapp').value;
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const payload = { serviceCode: selectedServiceCode, language: currentLang, whatsapp, timestamp: new Date().toISOString() };
      
      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        alert(`Senha emitida com sucesso: ${data.senha}! Verifique o WhatsApp.`);
      } catch (err) {
        alert('Erro ao processar senha no quiosque.');
      }
    }
    initCamera();
  </script>
</body>
</html>
