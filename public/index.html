<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porto da Praia - Quiosque Zero Touch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #38bdf8; font-size: 2.2rem; }
    header p { color: #94a3b8; font-size: 1.1rem; }
    .lang-selector { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; }
    .lang-btn { background: #1e293b; border: 2px solid #334155; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: all 0.2s; }
    .lang-btn.active, .lang-btn:hover { background: #0284c7; border-color: #38bdf8; }
    .container { width: 100%; max-width: 900px; background: #1e293b; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .section-title { font-size: 1.3rem; margin-bottom: 15px; color: #e2e8f0; border-bottom: 2px solid #334155; padding-bottom: 8px; }
    .grid-services { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .service-card { background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 1.1rem; font-weight: 600; }
    .service-card:hover, .service-card.selected { border-color: #38bdf8; background: #0369a1; }
    .camera-box { text-align: center; margin-bottom: 25px; }
    video { width: 100%; max-width: 480px; height: 270px; background: #000; border-radius: 12px; border: 2px solid #334155; object-fit: cover; }
    .input-group { margin-bottom: 25px; }
    .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 1rem; }
    .input-group input { width: 100%; padding: 14px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1.1rem; }
    .submit-btn { width: 100%; padding: 18px; background: #10b981; border: none; border-radius: 12px; color: #fff; font-size: 1.4rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .submit-btn:hover { background: #059669; }
    .nav-links { margin-top: 30px; display: flex; gap: 20px; justify-content: center; }
    .nav-links a { color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 1rem; background: #1e293b; padding: 10px 20px; border-radius: 8px; border: 1px solid #334155; }
    .nav-links a:hover { background: #334155; }
  </style>
</head>
<body>
  <header>
    <h1 id="title-main">PORTO DA PRAIA - ENAPOR</h1>
    <p id="subtitle-main">Atendimento Quiosque Zero Touch</p>
  </header>

  <div class="lang-selector">
    <button class="lang-btn active" onclick="setLang('cv')">Crioulo (CV)</button>
    <button class="lang-btn" onclick="setLang('pt')">Português</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('fr')">Français</button>
    <button class="lang-btn" onclick="setLang('es')">Español</button>
    <button class="lang-btn" onclick="setLang('ar')">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</button>
    <button class="lang-btn" onclick="setLang('zh')">&#20013;&#25991;</button>
  </div>

  <div class="container">
    <div class="section-title" id="sec-service">1. Selecione o Serviço</div>
    <div class="grid-services">
      <div class="service-card selected" onclick="selectService(this, 'ENC')" id="srv-enc">📦 Encomendas / Carga</div>
      <div class="service-card" onclick="selectService(this, 'TAX')" id="srv-tax">💳 Taxas Portuárias</div>
      <div class="service-card" onclick="selectService(this, 'PAS')" id="srv-pas">🎫 Passes & Credenciais</div>
      <div class="service-card" onclick="selectService(this, 'ALF')" id="srv-alf">🛃 Despacho Alfandegário</div>
    </div>

    <div class="section-title" id="sec-doc">2. Aproxime o CNI / Passaporte / QR Code</div>
    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="input-group">
      <label id="lbl-whatsapp">Número do WhatsApp para Receber a Senha:</label>
      <input type="tel" id="whatsapp" placeholder="Ex: 2389912345">
    </div>

    <button class="submit-btn" id="btn-submit" onclick="processCheckin()">EMITIR SENHA ZERO TOUCH</button>
  </div>

  <div class="nav-links">
    <a href="/balcao" target="_blank" id="link-balcao">🖥️ Aceder Painel do Funcionário (Balcão)</a>
    <a href="/tv" target="_blank" id="link-tv">📺 Aceder Ecrã da TV (Sala de Espera)</a>
  </div>

  <script>
    let currentLang = 'cv';
    let selectedServiceCode = 'ENC';
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');

    const i18n = {
      cv: {
        title: "PORTO DA PRAIA - ENAPOR",
        subtitle: "Atendimentu Kiosku Zero Touch",
        secService: "1. Disbulta Servisu",
        srvEnc: "📦 Encomendas / Karga",
        srvTax: "💳 Tasas Portuárias",
        srvPas: "🎫 Passes & Kredenciais",
        srvAlf: "🛃 Dispaxu Alfandegáriu",
        secDoc: "2. Aproxima CNI / Passaporti / QR Code",
        lblWp: "Número di WhatsApp pa Resebi Senha:",
        btnSub: "EMITIR SENHA ZERO TOUCH",
        linkBalcao: "🖥️ Painel di Funsionáriu",
        linkTv: "📺 Ecrã di TV (Sala di Spera)"
      },
      pt: {
        title: "PORTO DA PRAIA - ENAPOR",
        subtitle: "Atendimento Quiosque Zero Touch",
        secService: "1. Selecione o Serviço",
        srvEnc: "📦 Encomendas / Carga",
        srvTax: "💳 Taxas Portuárias",
        srvPas: "🎫 Passes & Credenciais",
        srvAlf: "🛃 Despacho Alfandegário",
        secDoc: "2. Aproxime o CNI / Passaporte / QR Code",
        lblWp: "Número do WhatsApp para Receber a Senha:",
        btnSub: "EMITIR SENHA ZERO TOUCH",
        linkBalcao: "🖥️ Painel do Funcionário",
        linkTv: "📺 Ecrã da TV (Sala de Espera)"
      },
      en: {
        title: "PORT OF PRAIA - ENAPOR",
        subtitle: "Zero Touch Kiosk Service",
        secService: "1. Select Service",
        srvEnc: "📦 Cargo / Parcels",
        srvTax: "💳 Port Fees",
        srvPas: "🎫 Passes & Badges",
        srvAlf: "🛃 Customs Clearance",
        secDoc: "2. Scan ID / Passport / QR Code",
        lblWp: "WhatsApp Number to Receive Ticket:",
        btnSub: "ISSUE ZERO TOUCH TICKET",
        linkBalcao: "🖥️ Staff Counter Panel",
        linkTv: "📺 Waiting Room TV Screen"
      },
      fr: {
        title: "PORT DE PRAIA - ENAPOR",
        subtitle: "Guichet Zero Touch",
        secService: "1. Sélectionnez le Service",
        srvEnc: "📦 Colis / Fret",
        srvTax: "💳 Taxes Portuaires",
        srvPas: "🎫 Badges & Passes",
        srvAlf: "🛃 Dédouanement",
        secDoc: "2. Approchez la CNI / Passeport / QR Code",
        lblWp: "Numéro WhatsApp pour recevoir le ticket:",
        btnSub: "ÉMETTRE LE TICKET ZERO TOUCH",
        linkBalcao: "🖥️ Panneau Agent (Guichet)",
        linkTv: "📺 Écran TV Salle d'Attente"
      },
      es: {
        title: "PUERTO DE PRAIA - ENAPOR",
        subtitle: "Quiosco Zero Touch",
        secService: "1. Seleccione el Servicio",
        srvEnc: "📦 Encomiendas / Carga",
        srvTax: "💳 Tasas Portuarias",
        srvPas: "🎫 Pases y Credenciales",
        srvAlf: "🛃 Despacho Aduanero",
        secDoc: "2. Acerque su CNI / Pasaporte / QR Code",
        lblWp: "Número de WhatsApp para recibir su turno:",
        btnSub: "EMITIR TURNO ZERO TOUCH",
        linkBalcao: "🖥️ Panel de Funcionario",
        linkTv: "📺 Pantalla de TV (Sala de Espera)"
      },
      ar: {
        title: "ميناء برايا - إينابور",
        subtitle: "خدمة الأكشاك الذكية",
        secService: "1. اختر الخدمة",
        srvEnc: "📦 الشحن والبضائع",
        srvTax: "💳 الرسوم المينائية",
        srvPas: "🎫 التصاريح والبطاقات",
        srvAlf: "🛃 التخليص الجمركي",
        secDoc: "2. تقريب بطاقة الهوية / جواز السفر",
        lblWp: "رقم الواتساب لاستلام التذكرة:",
        btnSub: "إصدار التذكرة الذكية",
        linkBalcao: "🖥️ لوحة موظف الاستقبال",
        linkTv: "📺 شاشة تلفزيون الانتظار"
      },
      zh: {
        title: "普拉亚港 - ENAPOR",
        subtitle: "零接触自助终端",
        secService: "1. 选择服务",
        srvEnc: "📦 货物 / 包裹",
        srvTax: "💳 港口费",
        srvPas: "🎫 通行证与证件",
        srvAlf: "🛃 海关清关",
        secDoc: "2. 请出示身份证 / 护照",
        lblWp: "接收号码的 WhatsApp 电话：",
        btnSub: "生成零接触凭证",
        linkBalcao: "🖥️ 柜台员工面板",
        linkTv: "📺 等候室电视屏幕"
      }
    };

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
      } catch (err) { console.warn('Câmara indisponível', err); }
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const t = i18n[lang];
      document.getElementById('title-main').innerText = t.title;
      document.getElementById('subtitle-main').innerText = t.subtitle;
      document.getElementById('sec-service').innerText = t.secService;
      document.getElementById('srv-enc').innerText = t.srvEnc;
      document.getElementById('srv-tax').innerText = t.srvTax;
      document.getElementById('srv-pas').innerText = t.srvPas;
      document.getElementById('srv-alf').innerText = t.srvAlf;
      document.getElementById('sec-doc').innerText = t.secDoc;
      document.getElementById('lbl-whatsapp').innerText = t.lblWp;
      document.getElementById('btn-submit').innerText = t.btnSub;
      document.getElementById('link-balcao').innerText = t.linkBalcao;
      document.getElementById('link-tv').innerText = t.linkTv;
    }

    function selectService(el, code) {
      selectedServiceCode = code;
      document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    async function processCheckin() {
      const whatsapp = document.getElementById('whatsapp').value;
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const payload = { serviceCode: selectedServiceCode, language: currentLang, whatsapp, timestamp: new Date().toISOString() };
      
      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        alert(`Senha emitida com sucesso: ${data.senha}! Verifique o WhatsApp.`);
      } catch (err) {
        alert('Erro ao processar senha no quiosque.');
      }
    }
    initCamera();
  </script>
</body>
</html>
